# Netlify settings — picked up automatically when you connect this folder or repo.
[build]
  publish = "public"
  functions = "netlify/functions"
  # No build step: the site is plain HTML/CSS/JS. Netlify still installs
  # package.json dependencies for the function.
  command = ""

# Every page (e.g. /team/bethel-a) is served by index.html; the JavaScript
# router then shows the right page. Real files (CSS, JS, images) still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
